[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zendesk-user-doctor"
version = "1.0.0"
description = "Audit a Zendesk end-user CSV export for duplicate users, unverified emails, suspended users with open tickets, and users with no tickets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
zendesk-user-doctor = "zendesk_user_doctor:main_entry"

[tool.setuptools]
py-modules = ["zendesk_user_doctor"]
